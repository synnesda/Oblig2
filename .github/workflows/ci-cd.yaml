name: Terraform CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - test
        - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
        - plan
        - apply
        - destroy

env:
  TF_VERSION: '1.6.0'
  # Keep only TF_VERSION here; Azure credentials are consumed directly from secrets

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init (for validation)
      run: terraform init -backend=false

    - name: Terraform Validate
      run: terraform validate

  terraform-security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    needs: terraform-validate
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  terraform-tfsec:
    name: 'tfsec static scan'
    runs-on: ubuntu-latest
    needs: terraform-security-scan

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tfsec
      run: |
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

    - name: Run tfsec
      run: |
        tfsec .

    - name: Upload tfsec results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: tfsec-report
        path: .tfsec

  terraform-plan-dev:
    name: 'Plan - Dev Environment'
    runs-on: ubuntu-latest
    needs: [terraform-validate, terraform-security-scan]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/dev/backend.hcl

    - name: Terraform Plan
      run: terraform plan -var-file=environments/dev/dev.tfvars -out=dev.tfplan

    - name: Show Plan
      id: show-plan
      run: |
        terraform show -no-color dev.tfplan > plan.txt || true
        echo "plan<<EOF" >> $GITHUB_OUTPUT
        cat plan.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Comment Plan on PR
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ### Terraform plan — dev
          ```terraform
          ${{ steps.show-plan.outputs.plan }}
          ```

    - name: Upload Dev Plan
      uses: actions/upload-artifact@v3
      with:
        name: dev-terraform-plan
        path: dev.tfplan
        retention-days: 5

  terraform-deploy-dev:
    name: 'Deploy - Dev Environment'
    runs-on: ubuntu-latest
    needs: terraform-plan-dev
    if: github.ref == 'refs/heads/develop'
    environment:
      name: dev
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Download Plan
      uses: actions/download-artifact@v3
      with:
        name: dev-terraform-plan

    - name: Terraform Init
      run: terraform init -backend-config=environments/dev/backend.hcl

    - name: Terraform Apply
      run: terraform apply -auto-approve dev.tfplan

  terraform-plan-test:
    name: 'Plan - Test Environment'
    runs-on: ubuntu-latest
    needs: terraform-deploy-dev
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/test/backend.hcl

    - name: Terraform Plan
      run: terraform plan -var-file=environments/test/test.tfvars -out=test.tfplan

    - name: Show Plan
      id: show-plan
      run: |
        terraform show -no-color test.tfplan > plan.txt || true
        echo "plan<<EOF" >> $GITHUB_OUTPUT
        cat plan.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Comment Plan on PR
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ### Terraform plan — test
          ```terraform
          ${{ steps.show-plan.outputs.plan }}
          ```

    - name: Upload Test Plan
      uses: actions/upload-artifact@v3
      with:
        name: test-terraform-plan
        path: test.tfplan
        retention-days: 5

  terraform-deploy-test:
    name: 'Deploy - Test Environment'
    runs-on: ubuntu-latest
    needs: terraform-plan-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: test
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Download Plan
      uses: actions/download-artifact@v3
      with:
        name: test-terraform-plan

    - name: Terraform Init
      run: terraform init -backend-config=environments/test/backend.hcl

    - name: Terraform Apply
      run: terraform apply -auto-approve test.tfplan

  terraform-deploy-prod:
    name: 'Deploy - Production Environment'
    runs-on: ubuntu-latest
    needs: terraform-deploy-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://portal.azure.com
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/prod/backend.hcl

    - name: Terraform Plan
      run: terraform plan -var-file=environments/prod/prod.tfvars -out=prod.tfplan

    - name: Manual Approval Required
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.TOKEN }}
        approvers: ${{ github.actor }}
        minimum-approvals: 1
        issue-title: "Production Deployment Approval"
        issue-body: "Please review the production deployment plan and approve if ready to proceed."

    - name: Terraform Apply
      run: terraform apply -auto-approve prod.tfplan

  manual-workflow:
    name: 'Manual Operations'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    # Legacy fallback removed — this workflow now requires OIDC-configured service principal.
    # To re-enable legacy login, add an azure/login step with creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Init
      run: terraform init -backend-config=environments/${{ github.event.inputs.environment }}/backend.hcl

    - name: Terraform Plan
      if: github.event.inputs.action == 'plan'
      run: terraform plan -var-file=environments/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars

    - name: Terraform Apply
      if: github.event.inputs.action == 'apply'
      run: terraform apply -var-file=environments/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -auto-approve

    - name: Terraform Destroy
      if: github.event.inputs.action == 'destroy'
      run: terraform destroy -var-file=environments/${{ github.event.inputs.environment }}/${{ github.event.inputs.environment }}.tfvars -auto-approve